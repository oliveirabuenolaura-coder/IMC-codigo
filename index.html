
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .result-box h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .result-box p {
            font-size: 16px;
            font-weight: 600;
        }

        /* Estilos para os status de IMC */
        .abaixo {
            background-color: #fff3cd;
            color: #856404;
        }

        .ideal {
            background-color: #d4edda;
            color: #155724;
        }

        .sobrepeso {
            background-color: #ffeba2;
            color: #856404;
        }

        .obesidade {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>⚖️ Calculadora de IMC</h1>

        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5">
        </div>

        <div class="input-group">
            <label for="altura">Altura (metros ou cm):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75 ou 175">
        </div>

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div id="resultado" class="result-box">
            <h2 id="valorIMC"></h2>
            <p id="classificacao"></p>
        </div>
    </div>

    <script>
        function calcularIMC() {
            const pesoInput = document.getElementById('peso').value;
            let alturaInput = document.getElementById('altura').value;

            const peso = parseFloat(pesoInput);
            let altura = parseFloat(alturaInput);

            // Converte centímetros para metros caso a pessoa digite 175 em vez de 1.75
            if (altura > 3) {
                altura = altura / 100;
            }

            const resultBox = document.getElementById('resultado');
            const valorIMC = document.getElementById('valorIMC');
            const classificacao = document.getElementById('classificacao');

            // Validação dos campos
            if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                alert("Por favor, preencha valores válidos para peso e altura.");
                return;
            }

            // Cálculo do IMC
            const imc = peso / (altura * altura);
            valorIMC.innerText = `Seu IMC é: ${imc.toFixed(2)}`;

            // Limpa classes anteriores
            resultBox.className = 'result-box';

            // Define a classificação e as cores
            if (imc < 18.5) {
                classificacao.innerText = 'Classificação: Abaixo do peso';
                resultBox.classList.add('abaixo');
            } else if (imc >= 18.5 && imc < 25) {
                classificacao.innerText = 'Classificação: Peso ideal (Parabéns!)';
                resultBox.classList.add('ideal');
            } else if (imc >= 25 && imc < 30) {
                classificacao.innerText = 'Classificação: Levemente acima do peso';
                resultBox.classList.add('sobrepeso');
            } else if (imc >= 30 && imc < 35) {
                classificacao.innerText = 'Classificação: Obesidade Grau I';
                resultBox.classList.add('obesidade');
            } else if (imc >= 35 && imc < 40) {
                classificacao.innerText = 'Classificação: Obesidade Grau II (severa)';
                resultBox.classList.add('obesidade');
            } else {
                classificacao.innerText = 'Classificação: Obesidade Grau III (mórbida)';
                resultBox.classList.add('obesidade');
            }

            // Exibe o resultado na tela
            resultBox.style.display = 'block';
        }
    </script>

</body>

</html>
